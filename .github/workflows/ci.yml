#
# The deployment-free tests on every push and pull request, and the reachable-advisory check. The
# conformance suite needs a live deployment and the service's runner; conformance.yml runs it.
#
# Daily as well, because a new advisory against a dependency that has not changed arrives without a
# commit to trigger anything. govulncheck reads the call graph, so an advisory in a function nothing
# here calls is reported and does not fail the job: failing on those would teach everybody to skip it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 5 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Referenced by commit SHA: a tag can be moved by whoever controls it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The toolchain CI builds and judges with, which is not go.mod's floor: the floor is the oldest
      # Go a consumer may use, and its standard library carries advisories govulncheck would report
      # against code nobody here ships.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go vet -tags live ./...
      - run: go test -count=1 ./...
      # Pinned by version, so the check that judges a commit does not change underneath it.
      - name: Reachable advisories
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
